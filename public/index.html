<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>karsh | Secure Login</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Fira Code', monospace; }

  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #0d0d17;
    color: #c5c6c7;
  }

  .login-container {
    background-color: #1c1c28;
    padding: 40px 50px;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
    text-align: center;
    width: 100%;
    max-width: 400px;
    animation: fadeIn 0.8s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    color: #61dafb;
    margin-bottom: 25px;
    font-size: 2.1em;
    letter-spacing: 1px;
  }
  .input-group { position: relative; }
  .input-group .auth-input {
  padding-right: 40px; /* space for eye */
}

  input[type="password"], input[type="text"], input[type="email"] {
    width: 100%;
    padding: 14px 40px 14px 14px;
    margin-bottom: 10px;
    border: none;
    border-radius: 6px;
    background-color: #10101a;
    color: #c5c6c7;
    font-size: 1em;
    outline: none;
    transition: 0.2s;
  }

  input:focus {
    background-color: #19192a;
    box-shadow: 0 0 6px #61dafb;
  }

  .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #61dafb;
    font-size: 1.1em;
    user-select: none;
  }

  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 6px;
    background-color: #61dafb;
    color: #0d0d17;
    font-weight: bold;
    font-size: 1em;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  button:hover {
    background-color: #21a1f1;
    transform: translateY(-2px);
  }

  .spinner {
    border: 3px solid #f3f3f3;
    border-top: 3px solid #0d0d17;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    animation: spin 0.8s linear infinite;
    margin-left: 10px;
    display: none;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .error-message {
    color: #ff4d4d;
    font-size: 0.9em;
    height: 18px;
    margin-top: 8px;
    opacity: 1;
    transition: opacity 0.3s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  .shake { animation: shake 0.4s; }

  p {
    margin-top: 20px;
    font-size: 0.85em;
    color: #777;
  }
  .caps-warning {
  font-size: 0.8em;
  color: #ffb347;
  margin-top: -6px;
  margin-bottom: 8px;
  display: none;
  text-align: left;
}

</style>
</head>

<body>
<div class="login-container">
  <h1>Secure Access</h1>
  <input type="email" id="email" placeholder="Enter Email" required autocomplete="email"/>
  <div class="input-group">
    
    <input type="password" id="password" placeholder="Enter Password" maxlength="30" />
    <span class="toggle-password" id="togglePassword">👁️</span>
  </div>
  <div class="caps-warning" id="capsWarning">⚠ Caps Lock is ON</div>

  <button id="loginBtn">Access <div class="spinner" id="spinner"></div></button>
  <div class="error-message" id="errorMessage"></div>
  <p>©2025 Powered by karsh Securities</p>
</div>

<audio id="errorSound" src="/error.mp3" preload="auto"></audio>

<script>
// ------------------ ELEMENTS ------------------
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const button = document.getElementById("loginBtn");
const spinner = document.getElementById("spinner");
const toggle = document.getElementById("togglePassword");
const errorMessage = document.getElementById("errorMessage");
const errorSound = document.getElementById("errorSound");
const loginBox = document.querySelector(".login-container");
const capsWarning = document.getElementById("capsWarning");

let errorTimeout;

// ------------------ DEVICE CHECK ------------------
function isMobile() {
  return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

// ------------------ ERROR FEEDBACK (MOBILE ONLY) ------------------
function playErrorFeedback() {
  if (!isMobile()) return;

  if (navigator.vibrate) navigator.vibrate(200);

  if (errorSound) {
    errorSound.currentTime = 0;
    errorSound.play().catch(() => {});
  }
}

// ------------------ PASSWORD TOGGLE ------------------
toggle.addEventListener("click", () => {
  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    toggle.textContent = "🙈";
  } else {
    passwordInput.type = "password";
    toggle.textContent = "👁️";
  }
});

// ------------------ CAPS LOCK WARNING ------------------
passwordInput.addEventListener("keyup", (e) => {
  if (e.getModifierState && e.getModifierState("CapsLock")) {
    capsWarning.style.display = "block";
  } else {
    capsWarning.style.display = "none";
  }
});

// ------------------ SHOW ERROR ------------------
function showError(message) {
  loginBox.classList.add("shake");
  playErrorFeedback();

  clearTimeout(errorTimeout);
  errorMessage.textContent = message;
  errorMessage.style.opacity = "1";

  errorTimeout = setTimeout(() => {
    errorMessage.style.opacity = "0";
    setTimeout(() => (errorMessage.textContent = ""), 300);
  }, 2000);

  setTimeout(() => loginBox.classList.remove("shake"), 400);
}

// ------------------ LOGIN FUNCTION ------------------
async function login() {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  if (!email) return showError("Please enter your email.");
  if (!password) return showError("Please enter your password.");

  spinner.style.display = "inline-block";
  button.disabled = true;

  try {
    const res = await fetch("/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    spinner.style.display = "none";
    button.disabled = false;
    passwordInput.value = "";

    if (data.ok) {
      window.location.href = "/protected";
    } else {
      showError("Invalid email or password.");
    }
  } catch (err) {
    spinner.style.display = "none";
    button.disabled = false;
    showError("Server unreachable. Try again later.");
  }
}

// ------------------ EVENTS ------------------
button.addEventListener("click", login);

passwordInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") login();
});

emailInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") login();
});

</script>
</body>
</html>
